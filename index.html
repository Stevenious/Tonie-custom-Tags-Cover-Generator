<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Code Generator Next Generation</title>
    <style>
        /* --- Tonies Theme Colors & Base --- */
        :root {
            --tonie-red: #e3000b;
            --tonie-blue: #00a0e9;
            --tonie-light: #f5f7fa;
            --text-dark: #2c3e50;
        }
        
        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tonie-light);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: var(--tonie-red);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* --- UI Sections --- */
        .panel {
            border: 2px solid #eef2f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel h2 {
            margin-top: 0;
            color: var(--tonie-blue);
            font-size: 1.2em;
        }

        input[type="text"], input[type="file"], select, button {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }

        input[type="text"] { width: 100%; box-sizing: border-box; }

        button {
            background-color: var(--tonie-red);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: #c2000a; }
        button.secondary { background-color: var(--tonie-blue); }
        button.secondary:hover { background-color: #0088c7; }

        /* --- Search Results --- */
        .results-box {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 10px;
        }

        .result-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item:hover { background-color: var(--tonie-light); }

        /* --- Editor & Preview --- */
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .preview-circle {
            background-color: #eee;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            /* Standard-Vorschau in 43mm für Münzkapseln */
            width: 162px; /* ca. 43mm auf Standard-Monitoren */
            height: 162px;
            margin: 0 auto;
        }

        .preview-text {
            background: rgba(255, 255, 255, 0.85);
            width: 100%;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 0;
        }

        /* --- Print Queue --- */
        #print-queue {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .queue-item {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--tonie-blue);
        }

        /* --- PRINT STYLES --- */
        @media screen {
            #print-layout { display: none; }
        }

        @media print {
            body * { visibility: hidden; margin: 0; padding: 0; }
            #print-layout, #print-layout * { visibility: visible; }
            #print-layout {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: flex;
                flex-wrap: wrap;
                gap: 2mm; /* Standard Abstand */
            }

            /* Exakte mm Angaben für den Druck */
            .print-circle {
                border-radius: 50%;
                background-size: cover;
                background-position: center;
                position: relative;
                overflow: hidden;
                box-sizing: border-box;
                page-break-inside: avoid;
            }

            /* Spezifische Formate */
            .format-30 { width: 30mm; height: 30mm; }
            .format-40 { width: 40mm; height: 40mm; }
            .format-43 { width: 43mm; height: 43mm; } /* Perfekt für Münzkapseln */
            
            /* Avery Zweckform Layouts (Grid für DIN A4 Bögen) */
            .format-avery30 {
                width: 30mm; height: 30mm;
                margin-right: 2.5mm; margin-bottom: 2.5mm;
            }
            .format-avery40 {
                width: 40mm; height: 40mm;
                margin-right: 3mm; margin-bottom: 3mm;
            }

            .print-text {
                position: absolute;
                bottom: 10%;
                width: 100%;
                text-align: center;
                background: rgba(255,255,255,0.9);
                font-size: 8pt;
                font-family: sans-serif;
                font-weight: bold;
                padding: 1mm 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tag Code Generator Next Generation</h1>

        <!-- Schritt 1: Datenquelle -->
        <div class="panel">
            <h2>1. Tonies.json laden (V1 oder V2)</h2>
            <p style="font-size: 0.9em; color: #666;">Lade hier die Community JSON-Datei(en) rein. Sie werden lokal im Browser verarbeitet.</p>
            <input type="file" id="json-upload" accept=".json" multiple>
            <span id="load-status" style="margin-left: 10px; color: var(--tonie-blue); font-weight: bold;"></span>
        </div>

        <!-- Schritt 2: Suchen -->
        <div class="panel">
            <h2>2. Suchen (z.B. "tkkg", "ID Nummer" oder "Titel")</h2>
            <input type="text" id="search-input" placeholder="Suchbegriff eingeben..." disabled>
            <div class="results-box" id="results-box">
                <!-- Ergebnisse landen hier -->
            </div>
        </div>

        <!-- Schritt 3: Cover Editor -->
        <div class="panel editor-grid">
            <div>
                <h2>3. Cover Editor</h2>
                <label>Benutzerdefinierter Text auf dem Cover:</label>
                <input type="text" id="cover-text" placeholder="z.B. TKKG Folge 1">
                
                <label>Hintergrundbild URL (wird auto-befüllt):</label>
                <input type="text" id="cover-img-url">
                
                <label>Druckformat für die Warteschlange wählen:</label>
                <select id="format-select">
                    <option value="format-43">43mm (Münzkapseln)</option>
                    <option value="format-40">40mm (Standard Rund)</option>
                    <option value="format-30">30mm (Klein)</option>
                    <option value="format-avery40">Avery Zweckform 40mm</option>
                    <option value="format-avery30">Avery Zweckform 30mm</option>
                </select>

                <button onclick="addToQueue()" style="width: 100%; margin-top: 15px;">Zur Druck-Warteschlange hinzufügen</button>
            </div>
            <div>
                <h2 style="text-align: center;">Vorschau</h2>
                <div class="preview-circle" id="preview-circle">
                    <div class="preview-text" id="preview-text-display">Tag Name</div>
                </div>
            </div>
        </div>

        <!-- Schritt 4: Drucken -->
        <div class="panel">
            <h2>4. Druck-Warteschlange (<span id="queue-count">0</span>)</h2>
            <div id="print-queue"></div>
            <button class="secondary" onclick="window.print()" style="margin-top: 15px; width: 100%;">🖨️ Aufkleber Drucken</button>
            <button onclick="clearQueue()" style="background-color: #999; margin-top: 5px; width: 100%;">Warteschlange leeren</button>
        </div>
    </div>

    <!-- Unsichtbarer Container für den echten Druck -->
    <div id="print-layout"></div>

    <script>
        let tonieData = [];
        let printQueue = [];

        // 1. JSON Dateien lokal einlesen und normalisieren
        document.getElementById('json-upload').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            document.getElementById('load-status').innerText = "Lade...";
            tonieData = []; // Reset

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const json = JSON.parse(event.target.result);
                        
                        // Normalisierung: V1 (Array) vs V2 (Objekt mit Hashes oder verschachtelt)
                        let parsedItems = [];
                        if (Array.isArray(json)) {
                            parsedItems = json;
                        } else {
                            // Falls es ein Objekt ist (z.B. V2), extrahiere die Werte
                            parsedItems = Object.values(json).flat(); 
                        }

                        // Mappe die wichtigsten Felder, da V1 und V2 oft unterschiedliche Keys haben
                        parsedItems.forEach(item => {
                            tonieData.push({
                                title: item.title || item.name || 'Unbekannt',
                                series: item.series || '',
                                id: item.id || item.audio_id || item.hash || '',
                                pic: item.pic || item.picture || item.image || ''
                            });
                        });

                        document.getElementById('load-status').innerText = `${tonieData.length} Einträge geladen!`;
                        document.getElementById('search-input').disabled = false;
                    } catch (err) {
                        alert("Fehler beim Parsen der JSON: " + err.message);
                    }
                };
                reader.readAsText(file);
            });
        });

        // 2. Echtzeit-Suche
        document.getElementById('search-input').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const resultsBox = document.getElementById('results-box');
            resultsBox.innerHTML = '';

            if (query.length < 2) return; // Erst ab 2 Zeichen suchen

            const filtered = tonieData.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.series.toLowerCase().includes(query) ||
                String(item.id).toLowerCase().includes(query)
            ).slice(0, 50); // Max 50 Ergebnisse für Performance

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                // Aufbau des Suchergebnisses wie gewünscht: tkkg-TKKG - ID nummer
                div.innerHTML = `
                    <span><b>${item.series} - ${item.title}</b> <br><small style="color:#666;">ID: ${item.id}</small></span>
                `;
                div.onclick = () => loadIntoEditor(item);
                resultsBox.appendChild(div);
            });
        });

        // 3. Editor befüllen
        function loadIntoEditor(item) {
            const displayName = item.series ? `${item.series} - ${item.title}` : item.title;
            document.getElementById('cover-text').value = displayName;
            document.getElementById('cover-img-url').value = item.pic;
            updatePreview();
        }

        // Live-Updates im Editor
        document.getElementById('cover-text').addEventListener('input', updatePreview);
        document.getElementById('cover-img-url').addEventListener('input', updatePreview);

        function updatePreview() {
            const text = document.getElementById('cover-text').value;
            const imgUrl = document.getElementById('cover-img-url').value;
            
            document.getElementById('preview-text-display').innerText = text;
            if(imgUrl) {
                document.getElementById('preview-circle').style.backgroundImage = `url('${imgUrl}')`;
            } else {
                document.getElementById('preview-circle').style.backgroundImage = 'none';
            }
        }

        // 4. Zur Warteschlange & zum Druck-Layout hinzufügen
        function addToQueue() {
            const text = document.getElementById('cover-text').value;
            const imgUrl = document.getElementById('cover-img-url').value;
            const format = document.getElementById('format-select').value;

            if (!text && !imgUrl) {
                alert("Bitte wähle zuerst einen Tag aus oder füge ein Bild/Text ein.");
                return;
            }

            // Mini-Vorschau in der UI
            const queueDiv = document.createElement('div');
            queueDiv.className = 'queue-item';
            queueDiv.style.backgroundImage = `url('${imgUrl}')`;
            document.getElementById('print-queue').appendChild(queueDiv);

            // Echtes Druck-Element anlegen
            const printElement = document.createElement('div');
            printElement.className = `print-circle ${format}`;
            printElement.style.backgroundImage = `url('${imgUrl}')`;
            
            if (text) {
                const textElement = document.createElement('div');
                textElement.className = 'print-text';
                textElement.innerText = text;
                printElement.appendChild(textElement);
            }

            document.getElementById('print-layout').appendChild(printElement);
            
            // Counter updaten
            const count = document.querySelectorAll('.queue-item').length;
            document.getElementById('queue-count').innerText = count;
        }

        function clearQueue() {
            document.getElementById('print-queue').innerHTML = '';
            document.getElementById('print-layout').innerHTML = '';
            document.getElementById('queue-count').innerText = '0';
        }
    </script>
</body>
</html>
