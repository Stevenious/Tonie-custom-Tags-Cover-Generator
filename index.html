<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TagGen Studio V2</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           MODULE: CSS Variables & Theme (Figma/Canva Style)
           ========================================================================== */
        :root {
            --primary: #E91E63;
            --primary-hover: #D81B60;
            --accent: #2196F3;
            
            --bg-app: #F5F5F5;
            --bg-panel: #FFFFFF;
            --bg-canvas: #E5E5E5;
            --bg-hover: #F0F0F0;
            
            --text-main: #1C1C1E;
            --text-sub: #636366;
            --border: #E5E5EA;
            
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            
            font-family: 'Inter', sans-serif;
        }

        [data-theme="dark"] {
            --bg-app: #121212;
            --bg-panel: #1E1E1E;
            --bg-canvas: #0A0A0A;
            --bg-hover: #2C2C2C;
            
            --text-main: #F5F5F5;
            --text-sub: #A0A0A5;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* ==========================================================================
           MODULE: Layout & Navigation
           ========================================================================== */
        .topbar {
            height: 56px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
        }

        .brand svg { width: 28px; height: 28px; }

        .view-toggle {
            display: flex;
            background: var(--bg-app);
            padding: 4px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .view-btn {
            padding: 6px 16px;
            border: none;
            background: transparent;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
            transition: 0.2s;
        }

        .view-btn.active {
            background: var(--bg-panel);
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
        }

        .topbar-actions { display: flex; gap: 12px; align-items: center; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-hover); }
        .btn-icon { padding: 8px; border-radius: var(--radius-sm); }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ==========================================================================
           MODULE: Left Sidebar (Library)
           ========================================================================== */
        .sidebar-left {
            width: 320px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s ease;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .search-box {
            margin: 16px;
            display: flex;
            gap: 8px;
        }
        
        .input-text {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-app);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .input-text:focus { border-color: var(--accent); }

        .library-grid {
            padding: 0 16px 16px 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
            flex: 1;
        }

        .asset-card {
            aspect-ratio: 1;
            background-color: var(--bg-app);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: 0.2s;
        }

        .asset-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .asset-label {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.95);
            padding: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top: 1px solid var(--border);
            color: #1C1C1E;
        }
        [data-theme="dark"] .asset-label { background: rgba(30,30,30,0.95); color: #F5F5F5; }

        /* ==========================================================================
           MODULE: Center Canvas (Editor & Print Studio)
           ========================================================================== */
        .canvas-area {
            flex: 1;
            background: var(--bg-canvas);
            position: relative;
            overflow: auto;
            display: flex;
            padding: 40px;
        }

        .canvas-area::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 0;
        }

        #view-design, #view-print {
            z-index: 1;
            display: none;
            width: 100%;
        }
        
        #view-design.active { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        #view-print.active { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px;
        }

        .active-sticker-container {
            background: var(--bg-panel);
            padding: 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .sticker {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px var(--border);
            --bg-x: 50%; --bg-y: 15%; --bg-scale: 100%;
            background-position: var(--bg-x) var(--bg-y);
            background-size: var(--bg-scale);
            background-repeat: no-repeat;
        }

        .sticker-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; --font-scale: 1; }
        .sticker-svg text { paint-order: stroke fill; stroke: white; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; font-family: 'Nunito', sans-serif; }
        .svg-series { fill: var(--primary); font-weight: 900; font-size: calc(9px * var(--font-scale)); text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Adjusted Typography for bottom texts */
        .svg-title { fill: #1C1C1E; font-weight: 800; font-size: calc(7px * var(--font-scale)); letter-spacing: 0.2px; }
        .svg-id { fill: #636366; font-weight: 700; font-size: calc(5px * var(--font-scale)); font-family: monospace; letter-spacing: 0.8px; }

        /* Print Toolbar (Now integrated cleanly above the sheet) */
        .print-toolbar {
            background: var(--bg-panel);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 210mm;
            width: 100%;
        }

        .a4-sheet {
            background: white;
            width: 210mm;
            min-height: 297mm;
            box-shadow: var(--shadow-lg);
            display: grid;
            box-sizing: border-box;
            position: relative;
        }
        
        .slot {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .slot.drag-over { background: rgba(33, 150, 243, 0.1); border: 2px dashed var(--accent); }
        .slot .sticker { width: 100%; height: 100%; cursor: grab; box-shadow: none; }
        
        .a4-sheet.show-cut-marks .sticker { border: 0.5pt dashed #A0A0A5 !important; }
        .a4-sheet.show-cut-marks .slot { border: 0.5pt dashed #A0A0A5 !important; }

        .delete-btn {
            position: absolute; top: 5%; right: 5%;
            background: var(--primary); color: white;
            border: none; border-radius: 50%;
            width: 24px; height: 24px; font-weight: bold;
            cursor: pointer; display: none; align-items: center; justify-content: center;
            z-index: 10; box-shadow: var(--shadow-sm);
        }
        #view-print .sticker:hover .delete-btn { display: flex; }

        /* ==========================================================================
           MODULE: Right Sidebar (Properties)
           ========================================================================== */
        .sidebar-right {
            width: 300px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .prop-section {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .prop-title { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }

        .prop-group { margin-bottom: 12px; }
        .prop-group label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }
        
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        select.input-text { cursor: pointer; }

        /* ==========================================================================
           MODULE: Print Media Queries
           ========================================================================== */
        @media print {
            @page { size: A4 portrait; margin: 0; }
            body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: white; }
            .topbar, .sidebar-left, .sidebar-right, .print-toolbar { display: none !important; }
            .workspace, .canvas-area, #view-print { display: block !important; padding: 0 !important; margin: 0 !important; background: transparent !important; }
            .canvas-area::before { display: none; }
            .a4-sheet { margin: 0; box-shadow: none; width: 210mm; height: 297mm; page-break-inside: avoid; }
            .a4-sheet.show-cut-marks .slot { border: 0.5pt dashed #A0A0A5 !important; border-radius: 0 !important; box-sizing: border-box; }
            .delete-btn { display: none !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="20" fill="var(--primary)"/>
                <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="8" stroke-dasharray="10 10"/>
                <path d="M 50 35 A 15 15 0 0 1 65 50" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="8" fill="white"/>
            </svg>
            TagGen Studio <span style="color:var(--primary);">V2</span>
        </div>

        <div class="view-toggle">
            <button class="view-btn active" id="btn-view-design" onclick="App.switchView('design')">🎨 Design</button>
            <button class="view-btn" id="btn-view-print" onclick="App.switchView('print')">🖨️ Print Studio</button>
        </div>

        <div class="topbar-actions">
            <span id="status-indicator" style="font-size: 0.8rem; font-weight: 600; color: var(--text-sub);">Lade Daten...</span>
            <button class="btn btn-outline btn-icon" onclick="App.toggleTheme()" title="Theme wechseln">🌓</button>
            <button class="btn btn-primary" onclick="PrintStudio.addCurrentToSheet()" id="nav-btn-add">+ Zum Bogen</button>
        </div>
    </header>

    <main class="workspace">
        <!-- LEFT SIDEBAR: Library -->
        <aside class="sidebar-left" id="panel-library">
            <div class="panel-header">Assets & Bibliothek</div>
            
            <div class="search-box">
                <input type="text" class="input-text" id="search-input" placeholder="Tonie suchen...">
                <button class="btn btn-outline btn-icon" title="Eigenes Bild" onclick="document.getElementById('fileUpload').click()">📷</button>
                <input type="file" id="fileUpload" accept="image/*" style="display:none" onchange="Library.handleCustomUpload(event)">
            </div>

            <div class="library-grid" id="library-grid">
                <!-- Injected via JS -->
            </div>
        </aside>

        <!-- CENTER: Canvas -->
        <section class="canvas-area">
            
            <!-- DESIGN VIEW -->
            <div id="view-design" class="active">
                <div class="active-sticker-container">
                    <div class="sticker" id="preview-sticker">
                        <div id="preview-svg-container" style="width:100%; height:100%; position:relative;"></div>
                    </div>
                </div>
            </div>

            <!-- PRINT VIEW -->
            <div id="view-print">
                <div class="print-toolbar">
                    <select class="input-text" id="format-type-select" style="width: 180px;">
                        <option value="free">Freies Raster</option>
                        <option value="avery">Avery Zweckform</option>
                    </select>
                    <select class="input-text" id="format-size-select" style="width: 180px;"></select>
                    <button class="btn btn-outline" id="btn-cutmarks">✂️ Linien</button>
                    <div style="width: 1px; background: var(--border); margin: 0 5px; height: 20px;"></div>
                    <button class="btn btn-outline" onclick="PrintStudio.autoFill()">⚡ Füllen</button>
                    <button class="btn btn-outline" onclick="PrintStudio.clear()">🗑️ Leeren</button>
                    <button class="btn btn-secondary" onclick="PrintStudio.exportPDF()">📄 PDF Export</button>
                    <button class="btn btn-primary" onclick="window.print()">🖨️ A4 Drucken</button>
                </div>
                <div class="a4-sheet show-cut-marks" id="a4-sheet"></div>
            </div>

        </section>

        <!-- RIGHT SIDEBAR: Properties -->
        <aside class="sidebar-right" id="panel-properties">
            <div class="prop-section">
                <div class="prop-title">Typografie</div>
                <div class="prop-group">
                    <label>Serie (Oben)</label>
                    <input type="text" class="input-text" id="edit-series" placeholder="z.B. TKKG">
                </div>
                <div class="prop-group">
                    <label>Titel (Unten)</label>
                    <input type="text" class="input-text" id="edit-title" placeholder="z.B. Folge 1">
                </div>
                <div class="prop-group">
                    <label>Audio-ID (UID)</label>
                    <input type="text" class="input-text" id="edit-uid" placeholder="Hex / ID...">
                </div>
                <div class="prop-group" style="margin-top: 15px;">
                    <label><span>Schriftgröße</span> <span id="val-font" style="color: var(--accent);">100%</span></label>
                    <input type="range" id="slide-font" min="50" max="150" value="100" step="5">
                </div>
            </div>

            <div class="prop-section">
                <div class="prop-title">Bild-Transformation</div>
                <div class="prop-group">
                    <label><span>Zoom</span> <span id="val-zoom" style="color: var(--accent);">100%</span></label>
                    <input type="range" id="slide-zoom" min="50" max="250" value="100" step="5">
                </div>
                <div class="prop-group">
                    <label>Position X (↔)</label>
                    <input type="range" id="slide-x" min="0" max="100" value="50" step="1">
                </div>
                <div class="prop-group">
                    <label>Position Y (↕)</label>
                    <input type="range" id="slide-y" min="0" max="100" value="15" step="1">
                </div>
            </div>
            
            <div class="prop-section" style="border:none;">
                <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;" onclick="PrintStudio.addCurrentToSheet()">
                    Auf den Bogen legen
                </button>
            </div>
        </aside>
    </main>

    <script>
        const CONFIG = {
            DATA_URL: 'https://raw.githubusercontent.com/toniebox-reverse-engineering/tonies-json/release/tonies.json',
            CACHE_KEY: 'taggen_v2_data'
        };

        const FORMATS = {
            '43': { type: 'free', size: '43mm', cols: 4, rows: 5, gap: '5mm', padding: '10mm', text: '43mm (20 Stk - Kapsel)' },
            '40': { type: 'free', size: '40mm', cols: 4, rows: 6, gap: '5mm', padding: '10mm', text: '40mm (24 Stk - Kapsel)' },
            '30': { type: 'free', size: '30mm', cols: 5, rows: 8, gap: '5mm', padding: '10mm', text: '30mm (40 Stk - Token)' },
            'L3415': { type: 'avery', size: '40mm', cols: 4, rows: 6, gap_col: '5mm', gap_row: '5mm', pad_top: '13mm', pad_left: '15mm', text: '40mm (Avery L3415 - 24 Stk)' },
            'avery30': { type: 'avery', size: '30mm', cols: 5, rows: 9, gap_col: '3mm', gap_row: '3mm', pad_top: '12mm', pad_left: '15mm', text: '30mm (Avery 30mm - 45 Stk)' }
        };

        const DOM = {
            status: document.getElementById('status-indicator'),
            search: document.getElementById('search-input'),
            grid: document.getElementById('library-grid'),
            editSeries: document.getElementById('edit-series'),
            editTitle: document.getElementById('edit-title'),
            editUid: document.getElementById('edit-uid'),
            slideFont: document.getElementById('slide-font'),
            slideZoom: document.getElementById('slide-zoom'),
            slideX: document.getElementById('slide-x'),
            slideY: document.getElementById('slide-y'),
            valFont: document.getElementById('val-font'),
            valZoom: document.getElementById('val-zoom'),
            previewBox: document.getElementById('preview-sticker'),
            previewSvg: document.getElementById('preview-svg-container'),
            sheet: document.getElementById('a4-sheet'),
            typeSelect: document.getElementById('format-type-select'),
            sizeSelect: document.getElementById('format-size-select'),
            btnCutmarks: document.getElementById('btn-cutmarks'),
            viewDesign: document.getElementById('view-design'),
            viewPrint: document.getElementById('view-print'),
            btnDesign: document.getElementById('btn-view-design'),
            btnPrint: document.getElementById('btn-view-print'),
            panelProps: document.getElementById('panel-properties'),
            panelLibrary: document.getElementById('panel-library')
        };

        const Editor = {
            currentItem: null,
            uidCounter: 0,

            init() {
                [DOM.editSeries, DOM.editTitle, DOM.editUid].forEach(el => el.addEventListener('input', () => this.renderSVG()));
                [DOM.slideFont, DOM.slideZoom, DOM.slideX, DOM.slideY].forEach(el => el.addEventListener('input', () => this.applyTransformations()));
            },

            loadItem(item) {
                this.currentItem = item;
                let s = item.series || ''; 
                let t = item.title || '';
                if(s && t.toLowerCase().includes(s.toLowerCase())) {
                    t = t.replace(new RegExp(s, 'ig'), '').replace(/^[\s\-–:]+|[\s\-–:]+$/g, '');
                }
                t = t.replace(/(?:Folge|Teil|Vol\.?|Episode)\s*\d+[\s\-–:]*/ig, '').trim();

                DOM.editSeries.value = s;
                DOM.editTitle.value = t || item.title || '';
                DOM.editUid.value = item.id !== 'undefined' ? item.id : '';
                DOM.previewBox.style.backgroundImage = item.pic ? `url('${item.pic}')` : 'none';
                
                this.renderSVG();
                this.applyTransformations();
            },

            applyTransformations() {
                DOM.valFont.innerText = DOM.slideFont.value + '%';
                DOM.valZoom.innerText = DOM.slideZoom.value + '%';
                DOM.previewBox.style.setProperty('--bg-scale', DOM.slideZoom.value + '%');
                DOM.previewBox.style.setProperty('--bg-x', DOM.slideX.value + '%');
                DOM.previewBox.style.setProperty('--bg-y', DOM.slideY.value + '%');
                this.renderSVG();
            },

            buildSVGString(sText, tText, idText, fontScale) {
                this.uidCounter++;
                const uid = `arc_${this.uidCounter}`;
                // PERFECTED MATH:
                // Top text curves from left to right over the top. Radius 35.
                // Title text curves from left to right over the bottom. Sweep=0 keeps it upright. Radius 32 (closer to image).
                // ID text curves from left to right over the bottom. Radius 42 (pushed out to the edge).
                return `
                    <svg viewBox="0 0 100 100" class="sticker-svg" style="--font-scale: ${fontScale}">
                        <defs>
                            <path id="top_${uid}" d="M 15 50 A 35 35 0 0 1 85 50" />
                            <path id="title_${uid}" d="M 18 50 A 32 32 0 0 0 82 50" />
                            <path id="id_${uid}" d="M 8 50 A 42 42 0 0 0 92 50" />
                        </defs>
                        <text class="svg-series"><textPath href="#top_${uid}" startOffset="50%" text-anchor="middle">${sText}</textPath></text>
                        <text class="svg-title"><textPath href="#title_${uid}" startOffset="50%" text-anchor="middle">${tText}</textPath></text>
                        <text class="svg-id"><textPath href="#id_${uid}" startOffset="50%" text-anchor="middle">${idText}</textPath></text>
                    </svg>
                `;
            },

            renderSVG() {
                if(!this.currentItem) return;
                const svgStr = this.buildSVGString(
                    DOM.editSeries.value.trim(), 
                    DOM.editTitle.value.trim(), 
                    DOM.editUid.value.trim(), 
                    DOM.slideFont.value / 100
                );
                DOM.previewSvg.innerHTML = svgStr;
                return svgStr;
            }
        };

        const PrintStudio = {
            stickerCount: 0,

            init() {
                DOM.typeSelect.addEventListener('change', () => this.populateSizeOptions());
                DOM.sizeSelect.addEventListener('change', () => this.buildSheet());
                DOM.btnCutmarks.addEventListener('click', () => {
                    DOM.sheet.classList.toggle('show-cut-marks');
                    DOM.btnCutmarks.classList.toggle('btn-primary');
                });
                this.populateSizeOptions();
            },

            populateSizeOptions() {
                const type = DOM.typeSelect.value;
                DOM.sizeSelect.innerHTML = '';
                Object.entries(FORMATS).filter(([_, conf]) => conf.type === type).forEach(([key, conf]) => {
                    const opt = document.createElement('option');
                    opt.value = key; opt.innerText = conf.text;
                    DOM.sizeSelect.appendChild(opt);
                });
                DOM.btnCutmarks.style.display = type === 'free' ? 'inline-flex' : 'none';
                this.buildSheet();
            },

            buildSheet() {
                const config = FORMATS[DOM.sizeSelect.value];
                DOM.sheet.innerHTML = ''; 
                DOM.sheet.style = 'display: grid;';
                
                if(config.type === 'free') {
                    DOM.sheet.style.gridTemplateColumns = `repeat(${config.cols}, ${config.size})`;
                    DOM.sheet.style.gap = config.gap;
                    DOM.sheet.style.padding = config.padding;
                    DOM.sheet.style.justifyContent = 'center';
                } else {
                    DOM.sheet.style.gridTemplateColumns = `repeat(${config.cols}, ${config.size})`;
                    DOM.sheet.style.gridTemplateRows = `repeat(${config.rows}, ${config.size})`;
                    DOM.sheet.style.columnGap = config.gap_col;
                    DOM.sheet.style.rowGap = config.gap_row;
                    DOM.sheet.style.paddingTop = config.pad_top;
                    DOM.sheet.style.paddingLeft = config.pad_left;
                }
                
                for(let i=0; i < config.cols * config.rows; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.style.width = config.size;
                    slot.style.height = config.size;
                    
                    slot.addEventListener('dragover', e => { e.preventDefault(); if(!slot.children.length) slot.classList.add('drag-over'); });
                    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
                    slot.addEventListener('drop', e => {
                        e.preventDefault(); slot.classList.remove('drag-over');
                        if(!slot.children.length) {
                            const d = document.getElementById(e.dataTransfer.getData('text/plain'));
                            if(d) slot.appendChild(d);
                        }
                    });
                    DOM.sheet.appendChild(slot);
                }
            },

            createStickerNode() {
                if(!Editor.currentItem) return null;
                this.stickerCount++;
                const sticker = document.createElement('div');
                sticker.className = 'sticker';
                sticker.id = `print-sticker-${this.stickerCount}`;
                sticker.draggable = true;
                
                if(Editor.currentItem.pic) sticker.style.backgroundImage = `url('${Editor.currentItem.pic}')`;
                sticker.style.setProperty('--bg-scale', DOM.slideZoom.value + '%');
                sticker.style.setProperty('--bg-x', DOM.slideX.value + '%');
                sticker.style.setProperty('--bg-y', DOM.slideY.value + '%');
                sticker.innerHTML = Editor.renderSVG();

                const del = document.createElement('button');
                del.className = 'delete-btn';
                del.innerHTML = '×';
                del.onclick = e => { e.stopPropagation(); sticker.remove(); };
                sticker.appendChild(del);

                sticker.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', sticker.id); setTimeout(() => sticker.style.opacity = '0.5', 0); });
                sticker.addEventListener('dragend', () => sticker.style.opacity = '1');
                return sticker;
            },

            addCurrentToSheet() {
                const node = this.createStickerNode();
                if(!node) { alert("Bitte erst ein Motiv wählen!"); return; }
                const empty = Array.from(DOM.sheet.querySelectorAll('.slot')).find(s => !s.children.length);
                if(!empty) { alert("Druckbogen ist voll!"); return; }
                empty.appendChild(node);
                App.switchView('print');
            },

            autoFill() {
                const empties = Array.from(DOM.sheet.querySelectorAll('.slot')).filter(s => !s.children.length);
                if(!empties.length) return alert("Bogen ist voll!");
                empties.forEach(slot => {
                    const node = this.createStickerNode();
                    if(node) slot.appendChild(node);
                });
            },

            clear() {
                if(confirm("Bogen wirklich leeren?")) this.buildSheet();
            },

            exportPDF() {
                const btns = DOM.sheet.querySelectorAll('.delete-btn');
                btns.forEach(b => b.style.display = 'none');
                html2pdf().set({
                    margin: 0, filename: 'TagGen_V2_Bogen.pdf',
                    image: { type: 'jpeg', quality: 1.0 },
                    html2canvas: { scale: 3, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                }).from(DOM.sheet).save().then(() => btns.forEach(b => b.style.display = ''));
            }
        };

        const Library = {
            data: [],
            async init() {
                DOM.search.addEventListener('input', e => this.search(e.target.value));
                await this.fetchData();
            },
            async fetchData() {
                const cached = localStorage.getItem(CONFIG.CACHE_KEY);
                if (cached) {
                    try {
                        this.data = JSON.parse(cached);
                        this.renderGrid(this.data.slice(0, 12));
                        DOM.status.innerText = `Library geladen ✓`;
                        return;
                    } catch(e) {}
                }
                try {
                    DOM.status.innerText = 'Lade GitHub...';
                    const response = await fetch(CONFIG.DATA_URL);
                    const rawData = await response.json();
                    let items = Array.isArray(rawData) ? rawData : Object.values(rawData).flat();
                    this.data = items.map(i => ({
                        title: i.title || i.name || '',
                        series: i.series || '',
                        id: String(i.audio_id || i.hash || i.id || ''),
                        pic: i.picture || i.pic || i.image || ''
                    })).filter(i => i.title || i.series);
                    localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify(this.data));
                    this.renderGrid(this.data.slice(0, 12));
                    DOM.status.innerText = `${this.data.length} Einträge ✓`;
                } catch (err) {
                    DOM.status.innerText = "Offline Modus";
                }
            },
            search(query) {
                const q = query.toLowerCase().trim();
                if(q.length < 2) { this.renderGrid(this.data.slice(0, 12)); return; }
                const results = this.data.filter(t => t.title.toLowerCase().includes(q) || t.series.toLowerCase().includes(q) || t.id.toLowerCase().includes(q)).slice(0, 12);
                this.renderGrid(results);
            },
            renderGrid(items) {
                DOM.grid.innerHTML = '';
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'asset-card';
                    if(item.pic) card.style.backgroundImage = `url('${item.pic}')`;
                    const label = document.createElement('div');
                    label.className = 'asset-label';
                    label.innerText = item.series ? `${item.series} - ${item.title}` : item.title;
                    card.appendChild(label);
                    card.onclick = () => { Editor.loadItem(item); App.switchView('design'); };
                    DOM.grid.appendChild(card);
                });
            },
            handleCustomUpload(e) {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        Editor.loadItem({ title: "Custom", series: "Eigenes Bild", id: "TAG", pic: ev.target.result });
                        App.switchView('design');
                    };
                    reader.readAsDataURL(file);
                }
            }
        };

        const App = {
            init() {
                this.initTheme();
                Editor.init();
                PrintStudio.init();
                Library.init();
            },
            initTheme() {
                const saved = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', saved);
            },
            toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            },
            switchView(view) {
                DOM.viewDesign.classList.toggle('active', view === 'design');
                DOM.viewPrint.classList.toggle('active', view === 'print');
                DOM.btnDesign.classList.toggle('active', view === 'design');
                DOM.btnPrint.classList.toggle('active', view === 'print');
                
                // Hide panels in print view to maximize space
                DOM.panelProps.style.display = view === 'print' ? 'none' : 'flex';
                DOM.panelLibrary.style.display = view === 'print' ? 'none' : 'flex'; // Hides left sidebar!
                document.getElementById('nav-btn-add').style.display = view === 'print' ? 'none' : 'flex';
            }
        };

        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
