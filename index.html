<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tonie & Tag Cover HUB</title>
    <style>
        :root, [data-theme="light"] {
            --brand-red: #A31E33; 
            --brand-red-hover: #8A192A;
            --brand-red-soft: rgba(163, 30, 51, 0.08);
            --bg-body: #F9F7F3;
            --bg-card: #FFFFFF;
            --bg-sub: #F0EEEA;
            --border-color: #E5E2DC;
            --text-main: #1D1B1A;
            --text-sub: #6B6661;
            --text-muted: #9C9690;
            --input-bg: #FFFFFF;
            --shadow-sm: 0 2px 8px rgba(29, 27, 26, 0.05);
            --shadow-md: 0 8px 24px rgba(29, 27, 26, 0.08);
        }

        [data-theme="dark"] {
            --brand-red: #D42743; 
            --brand-red-hover: #E82A49;
            --brand-red-soft: rgba(212, 39, 67, 0.15);
            --bg-body: #0F1115;
            --bg-card: #1A1C23;
            --bg-sub: #252830;
            --border-color: #323642;
            --text-main: #F4F4F5;
            --text-sub: #A1A1AA;
            --text-muted: #71717A;
            --input-bg: #1A1C23;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); transition: 0.25s; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem; }

        .app-header { background: var(--bg-card); padding: 12px 1rem; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .logo-container { flex: 1; display: flex; align-items: center; min-width: 0; }
        .logo-svg { height: 48px; width: 100%; max-width: 400px; }
        @media (max-width: 480px) { .logo-svg { height: 38px; } }
        
        .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .pill-btn { background: var(--bg-sub); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
        .pill-btn.accent { background: var(--brand-red); color: #FFF; border-color: var(--brand-red); }
        
        @media (max-width: 480px) {
            .pill-btn span:not(.icon) { display: none; }
            .pill-btn { padding: 8px; width: 36px; height: 36px; justify-content: center; }
        }

        .card { background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-color); padding: 1.25rem; margin-top: 1.5rem; box-shadow: var(--shadow-md); }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .card-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .step-badge { width: 28px; height: 28px; background: var(--brand-red); color: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }

        .tab-bar { display: flex; gap: 6px; background: var(--bg-sub); padding: 6px; border-radius: 12px; margin-bottom: 1rem; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 1 0 auto; white-space: nowrap; padding: 10px 14px; border: none; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--text-sub); cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--bg-card); color: var(--text-main); box-shadow: var(--shadow-sm); }

        .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-input { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 14px; outline: none; }
        .search-input:focus { border-color: var(--brand-red); }
        .status-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; padding: 0 4px; }

        .grid-motives { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
        .motive-card { background: var(--bg-sub); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; position: relative; }
        .motive-card.active { border-color: var(--brand-red); background: var(--brand-red-soft); box-shadow: 0 0 0 2px var(--brand-red); }
        .motive-img { width: 64px; height: 64px; object-fit: contain; border-radius: 50%; background: #FFF; margin-bottom: 8px; box-shadow: var(--shadow-sm); }
        
        .motive-series { font-size: 9px; font-weight: 800; color: var(--brand-red); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .motive-title { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0; }
        .fav-star { position: absolute; top: 6px; right: 6px; font-size: 16px; color: var(--text-muted); cursor: pointer; opacity: 0.5; }
        .fav-star.is-fav { color: #F59E0B; opacity: 1; }

        .editor-layout { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media (min-width: 768px) { .editor-layout { grid-template-columns: 1fr 1fr; } }
        
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; font-weight: 800; color: var(--text-sub); margin-bottom: 6px; }
        .input-field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 14px; font-weight: 500; outline: none; }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-sub); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-color); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); border-radius: 24px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background-color: var(--brand-red); }
        input:checked + .slider:before { transform: translateX(20px); }

        .quick-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .preset-badge { padding: 4px 10px; background: var(--bg-sub); border: 1px solid var(--border-color); border-radius: 999px; font-size: 11px; font-weight: 700; cursor: pointer; }

        .preview-stage { background: var(--bg-sub); border-radius: 16px; border: 1px dashed var(--border-color); display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .coin-capsule { width: 180px; height: 180px; border-radius: 50%; background: #FFF; box-shadow: var(--shadow-md); position: relative; overflow: hidden; }

        .sheet-board { background: #CBD5E1; padding: 1.5rem; border-radius: 16px; display: flex; justify-content: center; overflow-x: auto; box-shadow: inset 0 4px 12px rgba(0,0,0,0.1); margin: 1.5rem 0; }
        .sheet-paper { background: #FFF; padding: 15px; box-shadow: var(--shadow-md); display: grid; width: max-content; }
        .sheet-paper.grid-avery-40 { grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(8, 40px); gap: 4px; }
        .sheet-paper.grid-raster { grid-template-columns: repeat(4, 40px); grid-template-rows: repeat(6, 40px); gap: 8px; }

        .sheet-slot { border-radius: 50%; border: 1px dashed #94A3B8; background: #F8FAFC; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; color: #94A3B8; overflow: hidden; }
        .sheet-slot.filled { border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .action-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 600px) { .action-grid { grid-template-columns: 1fr 1fr; } }
        .big-btn { padding: 14px; font-size: 15px; font-weight: 800; border-radius: 14px; border: none; cursor: pointer; }
        .big-btn.primary { background: var(--brand-red); color: #FFF; }

        .no-print { display: block; }
        #printHost { display: none; }
        
        @media print {
            .no-print { display: none !important; }
            html, body { background: #FFF !important; margin: 0 !important; padding: 0 !important; width: 100% !important; height: 100% !important; }
            #printHost { display: block !important; position: absolute; top: 0; left: 0; width: 210mm; height: 297mm; background: #FFF; }
            .print-avery-40 { display: grid; grid-template-columns: repeat(3, 40mm); grid-template-rows: repeat(8, 40mm); justify-content: center; padding-top: 12.5mm; }
            .print-raster { display: flex; flex-wrap: wrap; gap: 4mm; padding: 15mm; align-content: flex-start; justify-content: flex-start; }
            .print-circle { border-radius: 50%; overflow: hidden; position: relative; }
            .print-avery-40 .print-circle { width: 40mm; height: 40mm; }
            .print-raster .print-circle { border: 0.5px dashed #A1A1AA; width: 40mm; height: 40mm; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <header class="app-header">
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 520 100" preserveAspectRatio="xMinYMid meet" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(10, 10)">
                        <circle cx="40" cy="40" r="38" fill="none" stroke="#A31E33" stroke-width="3"/>
                        <circle cx="40" cy="40" r="32" fill="none" stroke="#8A192A" stroke-width="2"/>
                        <circle cx="40" cy="40" r="26" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
                        <rect x="32" y="32" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#999" stroke-width="1"/>
                        <text x="40" y="43" font-family="sans-serif" font-size="6" font-weight="bold" fill="#666" text-anchor="middle">NFC</text>
                        <circle cx="40" cy="40" r="20" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
                        <path d="M 40 2 A 38 38 0 0 1 76 30" fill="none" stroke="#A31E33" stroke-width="3" stroke-linecap="round"/>
                        <polygon points="76,30 70,25 78,22" fill="#A31E33"/>
                    </g>
                    <text x="95" y="45" font-family="-apple-system, sans-serif" font-weight="900" font-size="34" fill="var(--text-main)" letter-spacing="-1">Tonie &amp; Tag <tspan fill="#A31E33">Cover HUB</tspan></text>
                    <text x="95" y="75" font-family="-apple-system, sans-serif" font-weight="700" font-size="19" fill="#888888" letter-spacing="0.5">MÜNZKAPSEL &amp; AVERY STUDIO</text>
                </svg>
            </div>
            <div class="header-actions">
                <button class="pill-btn" id="btnTheme"><span class="icon">☀️</span> <span>Dark Mode</span></button>
            </div>
        </header>

        <main class="container">
            <section class="card">
                <div class="card-header">
                    <div class="card-title"><div class="step-badge">1</div> Motiv auswählen</div>
                </div>
                <div class="tab-bar">
                    <button class="tab-btn active" id="tabDb">📚 Datenbank</button>
                    <button class="tab-btn" id="tabFav">⭐ Favoriten (<span id="favCount">0</span>)</button>
                    <button class="tab-btn" id="tabCustom">📷 Eigenes Bild</button>
                </div>

                <div id="viewDb">
                    <div class="search-box">
                        <input type="text" id="searchInput" class="search-input" placeholder="Titel, Serie oder ID suchen...">
                    </div>
                    <div class="status-row">
                        <span id="lblLibrary">Lade...</span>
                        <span id="lblCount">0 Motive</span>
                    </div>
                    <div class="grid-motives" id="gridMotives"></div>
                </div>

                <div id="viewCustom" style="display:none; padding: 2rem; border: 2px dashed var(--border-color); border-radius: 12px; text-align: center; cursor: pointer;">
                    <input type="file" id="fileInput" accept="image/png, image/jpeg" style="display:none;">
                    <div style="font-size: 32px; margin-bottom: 8px;">🖼️</div>
                    <div style="font-weight: 700;">Klicke hier für ein eigenes Foto</div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <div class="card-title"><div class="step-badge">2</div> Cover anpassen</div>
                </div>
                <div class="editor-layout">
                    <div>
                        <div class="input-group">
                            <label>1. TITEL / SERIE (OBERER BOGEN)</label>
                            <input type="text" id="inpSeries" class="input-field" placeholder="z.B. Conni oder TKKG">
                        </div>
                        <div class="input-group">
                            <label>2. ALBUM / FOLGE (UNTERER BOGEN)</label>
                            <input type="text" id="inpAlbum" class="input-field" placeholder="z.B. Spielt im Garten">
                        </div>
                        <div style="display:flex; gap:12px; align-items:flex-end;">
                            <div class="input-group" style="flex:1; margin-bottom:0;">
                                <label>3. TONIE-ID</label>
                                <input type="text" id="inpId" class="input-field" placeholder="01-XXXX">
                            </div>
                            <div class="toggle-row" style="margin-bottom:0; height: 44px;">
                                <span style="font-size: 11px; font-weight:700; margin-right:8px;">ID DRUCKEN</span>
                                <label class="switch">
                                    <input type="checkbox" id="chkId" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                        <div class="quick-presets">
                            <button class="preset-badge">Hörspiel</button>
                            <button class="preset-badge">Kinderlieder</button>
                            <button class="preset-badge">Mein Tonie</button>
                            <button class="preset-badge">Kreativ</button>
                        </div>
                    </div>
                    <div class="preview-stage">
                        <div class="coin-capsule" id="svgStage"></div>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <div class="card-title"><div class="step-badge">3</div> Druckbogen füllen</div>
                    <span style="font-size: 12px; font-weight: 700; color: var(--brand-red);" id="lblSheetInfo">24 Etiketten</span>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="input-group">
                        <label>DRUCKSYSTEM</label>
                        <select id="selSystem" class="input-field">
                            <option value="avery" selected>Avery Zweckform</option>
                            <option value="raster">Freies Raster (Stanzer)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>FORMAT</label>
                        <select id="selSize" class="input-field">
                            <option value="avery-40" selected>L3415 – Ø 40 mm (24x)</option>
                        </select>
                    </div>
                </div>

                <div class="sheet-board">
                    <div class="sheet-paper grid-avery-40" id="sheetGrid"></div>
                </div>
                
                <div style="display:flex; justify-content:center; gap:8px; margin-bottom:1.5rem;">
                    <button class="pill-btn" id="btnFillAll">Alle füllen</button>
                    <button class="pill-btn" id="btnClearAll">Bogen leeren</button>
                </div>

                <div class="action-grid">
                    <button class="big-btn primary" id="btnPrint">🖨️ A4 Bogen Drucken</button>
                </div>
            </section>
        </main>
    </div>

    <div id="printHost"></div>

    <script>
        (function() {
            "use strict";

            document.addEventListener('DOMContentLoaded', function() {
                
                function safeEl(id) { return document.getElementById(id); }
                function addEvt(id, type, fn) {
                    var el = safeEl(id);
                    if (el) el.addEventListener(type, fn);
                }

                function getFallbackPic(text, color) {
                    var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='"+color+"'/><circle cx='50' cy='50' r='42' fill='#FFF'/><text x='50' y='55' font-family='sans-serif' font-size='16' font-weight='bold' text-anchor='middle' fill='"+color+"'>"+text+"</text></svg>";
                    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
                }

                var App = {
                    theme: 'light',
                    db: [],
                    favorites: [],
                    activeTonie: null,
                    slots: new Array(24).fill(null),
                    currentFormat: 'avery-40',

                    offlineDb: [
                        { id: "01-0182", title: "Alarm im Freizeitpark", series: "TKKG Junior", pic: getFallbackPic("TKKG", "#A31E33") },
                        { id: "01-0010", title: "Feiert Geburtstag", series: "Conni", pic: getFallbackPic("CONNI", "#F59E0B") },
                        { id: "01-0305", title: "Die Olchis sind da", series: "Die Olchis", pic: getFallbackPic("OLCHIS", "#84CC16") },
                        { id: "01-0920", title: "Das Gespensterschloss", series: "Die drei ???", pic: getFallbackPic("???", "#1D1B1A") },
                        { id: "01-0910", title: "Kreativ-Tonie", series: "Mein Tonie", pic: getFallbackPic("KREATIV", "#3B82F6") }
                    ],

                    init: function() {
                        try {
                            var favs = localStorage.getItem('hub_favs_v82');
                            if (favs) this.favorites = JSON.parse(favs);
                            if (!Array.isArray(this.favorites)) this.favorites = [];
                        } catch(e) { this.favorites = []; }

                        this.db = this.offlineDb.slice();
                        
                        var lblCount = safeEl('lblCount');
                        if (lblCount) lblCount.innerText = this.db.length + " Motive";
                        
                        var lblLib = safeEl('lblLibrary');
                        if (lblLib) lblLib.innerText = "Offline-Bibliothek aktiv";

                        this.updateFavCounter();
                        this.bindEvents();
                        this.buildSheet();
                        this.renderGrid(this.db);
                        
                        if (this.db.length > 0) {
                            this.selectTonie(this.db[0]);
                        }
                        
                        this.fetchOnlineDB();
                    },

                    bindEvents: function() {
                        var self = this;
                        
                        addEvt('btnTheme', 'click', function() {
                            self.theme = self.theme === 'light' ? 'dark' : 'light';
                            document.documentElement.setAttribute('data-theme', self.theme);
                        });

                        ['tabDb', 'tabFav', 'tabCustom'].forEach(function(id) {
                            addEvt(id, 'click', function() { self.switchTab(id); });
                        });

                        addEvt('searchInput', 'input', function() { self.handleSearch(); });

                        ['inpSeries', 'inpAlbum', 'inpId', 'chkId'].forEach(function(id) {
                            addEvt(id, 'input', function() { self.updateSvgPreview(); });
                        });

                        document.querySelectorAll('.preset-badge').forEach(function(btn) {
                            btn.addEventListener('click', function(e) {
                                var inpA = safeEl('inpAlbum');
                                if(inpA) inpA.value = e.target.innerText;
                                self.updateSvgPreview();
                            });
                        });

                        addEvt('selSystem', 'change', function() { self.updateSizeDropdown(); });
                        addEvt('selSize', 'change', function() { self.buildSheet(); });

                        addEvt('btnFillAll', 'click', function() { self.fillSheet(); });
                        addEvt('btnClearAll', 'click', function() { 
                            self.slots = new Array(self.slots.length).fill(null);
                            self.renderSheetUI();
                        });
                        addEvt('btnPrint', 'click', function() { self.doPrint(); });

                        addEvt('viewCustom', 'click', function() {
                            var fi = safeEl('fileInput');
                            if(fi) fi.click();
                        });
                        addEvt('fileInput', 'change', function(e) {
                            var file = e.target.files[0];
                            if(!file) return;
                            var reader = new FileReader();
                            reader.onload = function(ev) {
                                self.selectTonie({ id: '00-0000', title: 'Eigenes Bild', series: 'Kreativ', pic: ev.target.result });
                            };
                            reader.readAsDataURL(file);
                        });
                    },

                    fetchOnlineDB: function() {
                        var self = this;
                        fetch('https://raw.githubusercontent.com/toniebox-reverse-engineering/tonies-json/release/tonies.json')
                            .then(function(res) { return res.json(); })
                            .then(function(data) {
                                if (Array.isArray(data) && data.length > 0) {
                                    self.db = data.map(function(t) {
                                        return {
                                            id: String(t.model || t.id || ''),
                                            series: String(t.series || 'Tonie'),
                                            title: String(t.episodes || t.title || t.name || ''),
                                            pic: t.pic || t.image || getFallbackPic("TONIE", "#CCC")
                                        };
                                    });
                                    var lblCount = safeEl('lblCount');
                                    var lblLib = safeEl('lblLibrary');
                                    if (lblCount) lblCount.innerText = self.db.length + " Motive";
                                    if (lblLib) lblLib.innerText = "Online-Datenbank bereit";
                                    self.handleSearch();
                                }
                            })
                            .catch(function(e) {
                                console.warn("Fetch failed, sticking to offline db.");
                            });
                    },

                    switchTab: function(activeId) {
                        ['tabDb', 'tabFav', 'tabCustom'].forEach(function(id) {
                            var el = safeEl(id);
                            if(el) el.classList.remove('active');
                        });
                        var activeEl = safeEl(activeId);
                        if(activeEl) activeEl.classList.add('active');
                        
                        var vDb = safeEl('viewDb');
                        var vCus = safeEl('viewCustom');
                        if (vDb) vDb.style.display = activeId === 'tabCustom' ? 'none' : 'block';
                        if (vCus) vCus.style.display = activeId === 'tabCustom' ? 'block' : 'none';

                        if (activeId === 'tabFav') {
                            var favs = this.db.filter(function(t) { return App.favorites.indexOf(t.id) > -1; });
                            this.renderGrid(favs);
                        } else if (activeId === 'tabDb') {
                            this.handleSearch();
                        }
                    },

                    handleSearch: function() {
                        var inp = safeEl('searchInput');
                        var q = inp ? String(inp.value).toLowerCase().trim() : '';
                        var res = this.db;
                        if (q) {
                            res = this.db.filter(function(t) {
                                return String(t.title).toLowerCase().indexOf(q) > -1 || 
                                       String(t.series).toLowerCase().indexOf(q) > -1 || 
                                       String(t.id).toLowerCase().indexOf(q) > -1;
                            });
                        }
                        this.renderGrid(res.slice(0, 60)); 
                    },

                    renderGrid: function(list) {
                        var grid = safeEl('gridMotives');
                        if (!grid) return;
                        grid.innerHTML = '';
                        var self = this;
                        
                        list.forEach(function(t) {
                            var isFav = self.favorites.indexOf(t.id) > -1;
                            var card = document.createElement('div');
                            card.className = 'motive-card' + (self.activeTonie && self.activeTonie.id === t.id ? ' active' : '');
                            
                            var img = document.createElement('img');
                            img.className = 'motive-img';
                            img.src = t.pic;
                            img.onerror = function() { 
                                this.onerror = null; 
                                this.src = getFallbackPic("ERROR", "#CCC"); 
                            };

                            var star = document.createElement('span');
                            star.className = 'fav-star' + (isFav ? ' is-fav' : '');
                            star.innerHTML = '★';
                            star.onclick = function(e) { e.stopPropagation(); self.toggleFav(t.id); };

                            var ser = document.createElement('div'); ser.className = 'motive-series'; ser.innerText = t.series;
                            var tit = document.createElement('div'); tit.className = 'motive-title'; tit.innerText = t.title;

                            card.appendChild(star);
                            card.appendChild(img);
                            card.appendChild(ser);
                            card.appendChild(tit);
                            
                            card.onclick = function() { self.selectTonie(t); };
                            grid.appendChild(card);
                        });
                    },

                    toggleFav: function(id) {
                        var idx = this.favorites.indexOf(id);
                        if (idx > -1) {
                            this.favorites.splice(idx, 1);
                        } else {
                            this.favorites.push(id);
                        }
                        try { localStorage.setItem('hub_favs_v82', JSON.stringify(this.favorites)); } catch(e) {}
                        this.updateFavCounter();
                        
                        var tabFav = safeEl('tabFav');
                        if (tabFav && tabFav.classList.contains('active')) {
                            this.switchTab('tabFav');
                        } else {
                            this.handleSearch();
                        }
                    },

                    updateFavCounter: function() {
                        var count = safeEl('favCount');
                        if (count) count.innerText = this.favorites.length;
                    },

                    selectTonie: function(t) {
                        this.activeTonie = t;
                        var inpS = safeEl('inpSeries');
                        var inpA = safeEl('inpAlbum');
                        var inpI = safeEl('inpId');
                        
                        if (inpS) inpS.value = t.series || '';
                        
                        var cleanTitle = String(t.title || '');
                        var sLow = String(t.series || '').toLowerCase();
                        if (sLow && cleanTitle.toLowerCase().indexOf(sLow) === 0) {
                            cleanTitle = cleanTitle.substring(sLow.length).replace(/^[\s\-:]+/, '');
                        }
                        
                        if (inpA) inpA.value = cleanTitle;
                        if (inpI) inpI.value = t.id || '';
                        
                        var cards = document.querySelectorAll('.motive-card');
                        for(var i=0; i<cards.length; i++){
                            cards[i].classList.remove('active');
                        }
                        
                        this.updateSvgPreview();
                    },

                    escapeXml: function(str) {
                        return str.replace(/[&<>"']/g, function(c) {
                            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c];
                        });
                    },

                    generateSvg: function() {
                        if (!this.activeTonie) return '';
                        var sEl = safeEl('inpSeries');
                        var aEl = safeEl('inpAlbum');
                        var iEl = safeEl('inpId');
                        var cEl = safeEl('chkId');
                        
                        var topText = this.escapeXml(sEl ? sEl.value : '');
                        var albumText = this.escapeXml(aEl ? aEl.value : '');
                        var idText = this.escapeXml(iEl ? iEl.value : '');
                        var showId = cEl ? cEl.checked : true;
                        
                        var bottomText = showId ? idText : albumText;
                        var bottomFont = showId ? 'monospace' : '-apple-system, sans-serif';
                        var bottomColor = showId ? '#A31E33' : '#1D1B1A';
                        
                        var safeImg = this.activeTonie.pic;
                        if(safeImg && safeImg.indexOf('<svg') > -1 && safeImg.indexOf('utf8,') > -1) {
                            safeImg = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(safeImg.substring(safeImg.indexOf('<svg')));
                        }

                        return '<svg viewBox="0 0 160 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">' +
                            '<defs>' +
                                '<clipPath id="circleClip"><circle cx="80" cy="80" r="80" /></clipPath>' +
                                '<path id="topC" d="M 18 80 A 62 62 0 0 1 142 80" fill="transparent" />' +
                                '<path id="botC" d="M 18 80 A 62 62 0 0 0 142 80" fill="transparent" />' +
                            '</defs>' +
                            '<circle cx="80" cy="80" r="80" fill="#FFFFFF" />' +
                            '<image href="'+safeImg+'" xlink:href="'+safeImg+'" x="15" y="15" width="130" height="130" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice" opacity="0.95" />' +
                            '<text font-family="-apple-system, sans-serif" font-weight="800" font-size="12" fill="#1D1B1A">' +
                                '<textPath href="#topC" startOffset="50%" text-anchor="middle">'+topText+'</textPath>' +
                            '</text>' +
                            '<text font-family="'+bottomFont+'" font-weight="700" font-size="11" fill="'+bottomColor+'">' +
                                '<textPath href="#botC" startOffset="50%" text-anchor="middle">'+bottomText+'</textPath>' +
                            '</text>' +
                        '</svg>';
                    },

                    updateSvgPreview: function() {
                        var stage = safeEl('svgStage');
                        if (stage) stage.innerHTML = this.generateSvg();
                    },

                    updateSizeDropdown: function() {
                        var sys = safeEl('selSystem');
                        var sizeSel = safeEl('selSize');
                        if (!sys || !sizeSel) return;
                        
                        sizeSel.innerHTML = '';
                        if (sys.value === 'avery') {
                            sizeSel.innerHTML = '<option value="avery-40">L3415 – Ø 40 mm (24x)</option>';
                        } else {
                            sizeSel.innerHTML = '<option value="raster-40">Münzkapsel 40 mm (24x)</option>';
                        }
                        this.buildSheet();
                    },

                    buildSheet: function() {
                        var sizeSel = safeEl('selSize');
                        var val = sizeSel ? sizeSel.value : 'avery-40';
                        this.currentFormat = val;
                        
                        var oldSlots = this.slots.slice();
                        this.slots = new Array(24).fill(null);
                        for(var i = 0; i < Math.min(oldSlots.length, 24); i++){
                            this.slots[i] = oldSlots[i];
                        }

                        var grid = safeEl('sheetGrid');
                        if (grid) {
                            grid.className = 'sheet-paper ' + (val.indexOf('avery')>-1 ? 'grid-avery-40' : 'grid-raster');
                        }
                        this.renderSheetUI();
                    },

                    renderSheetUI: function() {
                        var grid = safeEl('sheetGrid');
                        if (!grid) return;
                        grid.innerHTML = '';
                        var self = this;
                        
                        for(var i=0; i < this.slots.length; i++) {
                            (function(idx) {
                                var div = document.createElement('div');
                                var hasSvg = Boolean(self.slots[idx]);
                                div.className = 'sheet-slot' + (hasSvg ? ' filled' : '');
                                div.innerHTML = hasSvg ? self.slots[idx] : idx+1;
                                div.onclick = function() { self.toggleSlot(idx); };
                                grid.appendChild(div);
                            })(i);
                        }
                    },

                    toggleSlot: function(idx) {
                        if (this.slots[idx]) {
                            this.slots[idx] = null;
                        } else {
                            if (!this.activeTonie) return;
                            this.slots[idx] = this.generateSvg();
                        }
                        this.renderSheetUI();
                    },

                    fillSheet: function() {
                        if (!this.activeTonie) return;
                        var svg = this.generateSvg();
                        for(var i=0; i<this.slots.length; i++){
                            this.slots[i] = svg;
                        }
                        this.renderSheetUI();
                    },

                    doPrint: function() {
                        var isEmpty = true;
                        for(var j=0; j<this.slots.length; j++){
                            if(this.slots[j]) isEmpty = false;
                        }
                        if (isEmpty) this.fillSheet();
                        
                        var host = safeEl('printHost');
                        if (!host) return;
                        host.innerHTML = '';
                        host.className = this.currentFormat.indexOf('avery')>-1 ? 'print-avery-40' : 'print-raster';
                        
                        this.slots.forEach(function(svgStr) {
                            var c = document.createElement('div');
                            c.className = 'print-circle';
                            if (svgStr) c.innerHTML = svgStr;
                            host.appendChild(c);
                        });
                        
                        window.print();
                    }
                };

                App.init();
            });
        })();
    </script>
</body>
</html>
