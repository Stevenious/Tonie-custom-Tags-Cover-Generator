<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TagGen Studio V2.9 LTS Core – Phoenix Edition</title>
    
    <meta name="theme-color" content="#e11d48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Tonie Cover Generator Pro, Print Studio & NFC Magic Tag Companion">

    <!-- ESP Web Tools -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

    <style>
        :root {
            --primary: #e11d48;
            --primary-hover: #be123c;
            --bg-canvas: #f8fafc;
            --bg-sidebar: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;
            --status-exact: #10b981;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 14px rgba(15,23,42,0.06);
        }

        /* --- GLOBAL RESET --- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; max-width: 100%; overflow-x: hidden;
            background-color: var(--bg-canvas); color: var(--text-main);
            height: 100vh; height: 100dvh; display: flex; flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        img, canvas, svg, input, select, button { max-width: 100%; }

        /* --- DEBUG OVERLAY (P0-7) --- */
        #debug-overlay {
            display: none; position: fixed; top: 10px; right: 10px;
            background: rgba(15, 23, 42, 0.9); color: #22d3ee;
            padding: 10px 14px; border-radius: 8px; font-family: monospace; font-size: 11px;
            z-index: 9999; box-shadow: var(--shadow-lg); pointer-events: none;
            backdrop-filter: blur(4px); white-space: pre-wrap; line-height: 1.4;
        }

        /* --- HEADER --- */
        header {
            height: 60px; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
            z-index: 100; flex-shrink: 0;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; user-select: none; cursor: pointer; }
        .brand svg { width: 24px; height: 24px; stroke: var(--primary); stroke-width: 2.2; fill: none; }
        
        .view-switcher {
            display: flex; background: rgba(15, 23, 42, 0.05); padding: 3px; border-radius: 10px; gap: 3px;
            max-width: 65vw; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .view-switcher::-webkit-scrollbar { display: none; }
        .view-btn {
            background: transparent; border: none; padding: 6px 12px; font-size: 12px; font-weight: 600;
            color: var(--text-muted); border-radius: 7px; cursor: pointer; white-space: nowrap; transition: 0.15s;
        }
        .view-btn.active { background: #fff; color: var(--text-main); box-shadow: var(--shadow-sm); }
        .db-badge { background: #f1f5f9; padding: 4px 10px; border-radius: 20px; font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); white-space: nowrap; }

        /* --- WORKSPACES --- */
        .app-container { flex: 1; display: flex; overflow: hidden; flex-direction: column; width: 100%; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
        .workspace { flex: 1; display: none; flex-direction: column; background: var(--bg-canvas); overflow: hidden; width: 100%; }
        .workspace.active { display: flex; }

        /* --- STUDIO LAYOUT --- */
        .studio-layout { display: flex; flex: 1; overflow: hidden; width: 100%; min-width: 0; }
        .sidebar-lib { width: 440px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20; flex-shrink: 0; min-width: 0; }
        .lib-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: #ffffff; flex-shrink: 0; }
        
        .search-input { width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: var(--bg-canvas); }
        .search-input:focus { border-color: var(--primary); background: #fff; }
        .filter-row { display: flex; gap: 6px; min-width: 0; }
        .filter-select { flex: 1; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; background: #fff; outline: none; }

        /* --- LIBRARY GRID (P0-5 & P0-6) --- */
        .library-grid-wrap { width: 100%; min-width: 0; overflow: hidden; flex: 1; display: flex; flex-direction: column; }
        .asset-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; }
        
        .library-grid {
            display: grid; width: 100%; min-width: 0;
            grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start;
        }

        .card {
            width: 100%; min-width: 0; overflow: hidden; background: #fff; border: 1px solid var(--border);
            border-radius: 10px; cursor: pointer; display: flex; flex-direction: column;
            transition: transform 0.12s ease, border-color 0.12s ease; box-shadow: var(--shadow-sm);
            height: 100%; /* Ensures cards stretch evenly */
        }
        .card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        
        .card-image { width: 100%; aspect-ratio: 1; background: var(--bg-canvas); position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
        .card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .card-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; overflow: hidden; }
        .card-series { font-size: 9px; font-weight: 700; color: var(--primary); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-title { font-size: 12px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* ID explicitly at bottom via auto margin */
        .card-id { margin-top: auto; font-size: 10px; font-family: monospace; color: var(--text-muted); opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Pagination Bar (P0-4) */
        .pagination-bar {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 16px;
            background: #fff; border-top: 1px solid var(--border); flex-shrink: 0;
        }
        .pagination-bar button {
            background: #f1f5f9; border: 1px solid var(--border); color: var(--text-main); font-weight: bold;
            padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .pagination-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-indicator { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        /* --- EDITOR AREA --- */
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; -webkit-overflow-scrolling: touch; min-width: 0; }
        .preview-wrapper { background: #fff; padding: 28px 32px; border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 0; }
        
        .tag-circle { width: 270px; height: 270px; border-radius: 50%; border: 2px dashed #cbd5e1; position: relative; overflow: hidden; background: #fff; }
        .tag-circle img { width: 100%; height: 100%; object-fit: contain; position: absolute; transform-origin: center center; }
        .tag-circle svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

        /* --- SIDEBAR CONTROLS --- */
        .sidebar-controls { width: 330px; background: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; flex-shrink: 0; min-width: 0; }
        .control-section { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .control-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
        .input-group { display: flex; flex-direction: column; gap: 3px; }
        .input-group label { font-size: 11px; font-weight: 600; display: flex; justify-content: space-between; }
        .input-group input[type="text"], .input-group select { padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; outline: none; background: #fff; min-width: 0; }
        .input-group input[type="text"]:focus { border-color: var(--primary); }
        
        .btn { background: var(--primary); color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-secondary { background: #fff; color: var(--text-main); border: 1px solid var(--border); padding: 7px 11px; border-radius: 7px; font-size: 11px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }

        /* --- PRINT STUDIO (P0-8: A4 ISOLATION) --- */
        .print-toolbar { background: #fff; padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .print-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 24px; display: flex; justify-content: center; align-items: flex-start; background: #e2e8f0; }
        
        .a4-wrapper { width: 100%; max-width: 210mm; aspect-ratio: 210 / 297; background: white; box-shadow: var(--shadow-lg); position: relative; }
        .a4-sheet { width: 100%; height: 100%; position: absolute; inset: 0; }

        .slot { position: absolute; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-sizing: border-box; background: #fafafa; }
        .sticker { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .sticker-actions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 4px; background: rgba(15,23,42,0.85); backdrop-filter: blur(4px); padding: 6px; border-radius: 20px; opacity: 0; pointer-events: none; z-index: 10; }
        .sticker:hover .sticker-actions { opacity: 1; pointer-events: auto; }
        .s-btn { background: none; border: none; color: #fff; font-size: 12px; cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .s-btn:hover { background: rgba(255,255,255,0.2); }
        .s-btn.del:hover { background: var(--primary); }

        /* --- MOBILE 3-PAGE VIEW --- */
        @media (max-width: 850px) {
            header { height: 54px; padding: 0 10px; }
            .brand { font-size: 14px; }
            .header-actions { display: none; }
            
            .view-switcher { flex-basis: 100%; margin-left: auto; max-width: 100%; }
            .studio-layout { width: 300vw; max-width: none; overflow: hidden; transition: transform 0.25s ease; }
            .sidebar-lib, .canvas-area, .sidebar-controls { flex: 0 0 100vw; width: 100vw; max-width: 100vw; border: 0; padding-left: 4px; padding-right: 4px; overflow-y: auto; }
            
            .library-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .a4-wrapper { width: min(210mm, calc(100vw - 20px)); height: auto; aspect-ratio: 210 / 297; margin: 0 auto; }
        }

        .mobile-pagination-bar { display: none; justify-content: space-between; align-items: center; padding: 6px 12px; background: #fff; border-top: 1px solid var(--border); flex-shrink: 0; z-index: 50; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
        .mobile-pagination-dots { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; cursor: pointer; }
        .dot.active { background: var(--primary); transform: scale(1.25); }
        @media (max-width: 850px) { .mobile-pagination-bar { display: flex; } }

        /* --- PRINT MEDIA ISOLATION (P0-8) --- */
        @media print {
            body { background: white !important; margin: 0; padding: 0; visibility: hidden; }
            header, .view-switcher, .print-toolbar, .mobile-pagination-bar, .sidebar-lib, .sidebar-controls, .lib-header, #debug-overlay { display: none !important; }
            #view-print, #view-print * { visibility: visible; }
            #view-print { position: absolute; left: 0; top: 0; margin: 0; padding: 0; width: 210mm; height: 297mm; display: block !important; background: transparent; }
            .print-scroll { padding: 0 !important; background: transparent !important; display: block !important; }
            .a4-wrapper { width: 210mm !important; height: 297mm !important; max-width: 210mm !important; box-shadow: none !important; margin: 0 !important; }
            .slot { border: none !important; background: transparent !important; }
            .sticker-actions { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Debug Overlay -->
    <div id="debug-overlay"></div>

    <header>
        <div class="brand" onclick="App.switchView('design')">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
            <span>TagGen <span style="color:var(--primary);">Phoenix</span> <span style="font-size:10px; background:var(--bg-canvas); color:var(--text-muted); padding:2px 6px; border-radius:8px; margin-left:3px;">V2.9 LTS Core</span></span>
        </div>

        <div class="view-switcher">
            <button class="view-btn active" data-view="design" onclick="App.switchView('design')">1. Studio & Cover</button>
            <button class="view-btn" data-view="print" onclick="App.switchView('print')">2. Druckbogen</button>
        </div>

        <div class="header-actions">
            <span class="db-badge" id="db-status">Lade...</span>
        </div>

    <div class="app-container">
        <!-- ==================== VIEW 1: STUDIO ==================== -->
        <div class="workspace active" id="view-design">
            <div class="studio-layout" id="studio-swipe-container">
                
                <!-- LIBRARY -->
                <div class="sidebar-lib">
                    <div class="lib-header">

                        <div class="filter-row">

                            </select>

                    </div>
                    
                    <div class="library-grid-wrap">

                            <div class="library-grid" id="cardGrid"></div>

                        <div class="pagination-bar">
                            <button id="btn-prev" onclick="State.prevPage()">◀ Zurück</button>
                            <span class="page-indicator" id="page-indicator">1 / 1</span>

                <!-- EDITOR CANVAS -->

                            <img id="preview-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="">
                            <svg viewBox="0 0 100 100">

                                <path id="path-uid" d="M 22,50 A 28,28 0 0,0 78,50" fill="none"/>

            <!-- Mobile Swipe Bar -->

    <script>
        // --- 1. CORE UTILITIES ---
        // Normalization (P0-2) ensures robust string matching
        const normalizeText = (t) => {
            if (!t) return "";
            return String(t)
                .toLowerCase()
                .normalize("NFD")
                .replace(/\p{Diacritic}/gu, "")
                .replace(/[^\p{L}\p{N} ]/gu, " ")
                .replace(/\s+/g, " ")
                .trim();
        };

        const normalizeId = (id) => {
            if (!id) return "";
            return String(id).toUpperCase().replace(/[^A-Z0-9]/g, "");
        };

        // --- 2. GLOBAL STATE (Single Source of Truth) ---
        const State = {
            database: [],
            searchIndex: [],     // Unified mapping
            filteredDatabase: [], // Output of search
            currentPage: 1,
            pageSize: 8,
            isDebug: new URLSearchParams(window.location.search).has('debug'),

            initIndex(rawData) {
                // P0-1: Build a clean search index
                this.searchIndex = rawData.map((item, index) => {
                    // Extract safe primary audio ID
                    let primaryId = "";
                    const ids = item.audio_id || item.audioId || [item.id || item.no];
                    if (Array.isArray(ids) && ids.length > 0) primaryId = ids[0];

                    return {
                        id: primaryId || `gen_${index}`,
                        title: item.episode || item.title || item.episodes || item.name || "",
                        series: item.series || item.collection || item.brand || "",
                        audioId: normalizeId(primaryId),
                        image: item.image || item.pic || item.picture || item.img || "",
                        raw: item // Keep reference if needed for other UI parts
                    };
                }).filter(i => i.title || i.series || i.audioId); // Drop completely empty entries

                this.database = this.searchIndex; // In V2.9 Core, DB is identical to the cleaned Index
                this.searchDatabase(""); // Init full view
                
                document.getElementById('db-status').textContent = `${this.searchIndex.length} Tonies`;
            },

            // --- P0-3 & P0-10: CASCADING SEARCH LOGIC ---
            searchDatabase(query) {
                const q = normalizeText(query);
                const qId = normalizeId(query);
                const isFuzzy = document.getElementById('filter-match').value === 'fuzzy';

                if (!q) {
                    this.filteredDatabase = [...this.searchIndex];
                } else {
                    let results = [];
                    
                    // 1. Exact Match (ID, Title, Series)
                    const exact = this.searchIndex.filter(item => 
                        item.audioId === qId || 
                        normalizeText(item.title) === q || 
                        normalizeText(item.series) === q
                    );
                    
                    if (exact.length > 0) {
                        results = exact;
                    } else {
                        // 2. Prefix Match (Starts with)
                        const prefix = this.searchIndex.filter(item => 
                            normalizeText(item.title).startsWith(q) || 
                            normalizeText(item.series).startsWith(q)
                        );
                        
                        if (prefix.length > 0) {
                            results = prefix;
                        } else {
                            // 3. Contains Match (Includes)
                            const contains = this.searchIndex.filter(item => 
                                normalizeText(item.title).includes(q) || 
                                normalizeText(item.series).includes(q)
                            );
                            
                            if (contains.length > 0) {
                                results = contains;
                            } else if (isFuzzy) {
                                // 4. Fuzzy Fallback (Custom implementation without external Fuse.js dependency)
                                // Only triggers if explicitly enabled and nothing else found
                                const chars = q.split('');
                                const fuzzyMatches = this.searchIndex.filter(item => {
                                    const haystack = normalizeText(item.title) + " " + normalizeText(item.series);
                                    let j = 0;
                                    for(let i = 0; i < haystack.length && j < chars.length; i++) {
                                        if(haystack[i] === chars[j]) j++;
                                    }
                                    return j === chars.length; // Found all chars in order
                                });
                                results = fuzzyMatches;
                            }
                        }
                    }
                    this.filteredDatabase = results;
                }

                // Bug 5 & 9 Fix: Reset to page 1, then render
                this.currentPage = 1;
                this.updateLibrary();
            },

            onSearchInput() {
                const query = document.getElementById('search-input').value;
                this.searchDatabase(query);
            },

            // --- P0-4 & P0-6: PAGINATION & VISIBLE RENDER ---
            updateLibrary() {
                this.renderPagination();
                this.renderGrid();
                this.renderDebug();
            },

            getVisibleItems() {
                const start = (this.currentPage - 1) * this.pageSize;
                const end = start + this.pageSize;
                return this.filteredDatabase.slice(start, end);
            },

            renderPagination() {
                const totalPages = Math.ceil(this.filteredDatabase.length / this.pageSize) || 1;
                document.getElementById('page-indicator').textContent = `${this.currentPage} / ${totalPages}`;
                document.getElementById('btn-prev').disabled = this.currentPage <= 1;
                document.getElementById('btn-next').disabled = this.currentPage >= totalPages;
            },

            prevPage() { if (this.currentPage > 1) { this.currentPage--; this.updateLibrary(); } },
            nextPage() { const total = Math.ceil(this.filteredDatabase.length / this.pageSize); if (this.currentPage < total) { this.currentPage++; this.updateLibrary(); } },

            renderGrid() {
                const grid = document.getElementById('cardGrid');
                grid.innerHTML = '';
                const items = this.getVisibleItems();

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => EditorState.load(item);

                    // P0-6: Card Structure without position:absolute for ID
                    const imgWrap = document.createElement('div');
                    imgWrap.className = 'card-image';
                    const img = document.createElement('img');
                    img.src = item.image || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                    imgWrap.appendChild(img);

                    const infoWrap = document.createElement('div');
                    infoWrap.className = 'card-info';
                    
                    const series = document.createElement('div'); series.className = 'card-series'; series.textContent = item.series || '-';
                    const title = document.createElement('div'); title.className = 'card-title'; title.textContent = item.title || 'Ohne Titel';
                    const idLine = document.createElement('div'); idLine.className = 'card-id'; idLine.textContent = item.audioId ? `ID: ${item.audioId}` : '';

                    infoWrap.appendChild(series);
                    infoWrap.appendChild(title);
                    infoWrap.appendChild(idLine); // Clean flex rendering at bottom

                    card.appendChild(imgWrap);
                    card.appendChild(infoWrap);
                    grid.appendChild(card);
                });
            },

            renderDebug() {
                if(!this.isDebug) return;
                const overlay = document.getElementById('debug-overlay');
                overlay.style.display = 'block';
                const totalPages = Math.ceil(this.filteredDatabase.length / this.pageSize) || 1;
                overlay.textContent = 
`TagGen Debug (V2.9 Core)
──────────────
DB loaded: ${this.searchIndex.length}
Filtered:  ${this.filteredDatabase.length}
Visible:   ${this.getVisibleItems().length}
Page:      ${this.currentPage} / ${totalPages}
Mode:      ${document.getElementById('filter-match').value}`;
            }
        };

        // --- 3. EDITOR STATE ---
        const EditorState = {
            current: null,
            zoom: 100, x: 0, y: 0, font: 100,
            
            load(item) {
                this.current = item;
                this.zoom = 100; this.x = 0; this.y = 0; this.font = 100;
                
                document.getElementById('input-serie').value = item.series || '';
                document.getElementById('input-title').value = item.title || '';
                document.getElementById('input-uid').value = item.audioId || '';
                
                document.getElementById('slider-zoom').value = 100;
                document.getElementById('slider-x').value = 0;
                document.getElementById('slider-y').value = 0;
                document.getElementById('slider-font').value = 100;

                this.syncFromUI();
            },
            syncFromUI() {
                if (!this.current) this.current = { image: 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=' };
                
                this.current.series = document.getElementById('input-serie').value;
                this.current.title = document.getElementById('input-title').value;
                this.current.audioId = document.getElementById('input-uid').value;
                
                this.zoom = parseInt(document.getElementById('slider-zoom').value, 10);
                this.x = parseInt(document.getElementById('slider-x').value, 10);
                this.y = parseInt(document.getElementById('slider-y').value, 10);
                this.font = parseInt(document.getElementById('slider-font').value, 10);

                this.renderCanvas();
            },
            resetTransforms() {
                this.zoom = 100; this.x = 0; this.y = 0; this.syncFromUI();
            },
            uploadImage(e) {
                const file = e.target.files?.[0]; if(!file) return;
                const r = new FileReader(); 
                r.onload = ev => { if(!this.current) this.current={}; this.current.image = ev.target.result; this.renderCanvas(); };
                r.readAsDataURL(file);
            },
            renderCanvas() {
                document.getElementById('val-zoom').textContent = `${this.zoom}%`;
                document.getElementById('val-x').textContent = `${this.x}%`;
                document.getElementById('val-y').textContent = `${this.y}%`;
                document.getElementById('val-font').textContent = `${this.font}%`;

                const img = document.getElementById('preview-img');
                img.src = this.current.image;
                img.style.transform = `translate(${this.x}%, ${this.y}%) scale(${this.zoom / 100})`;

                const fScale = this.font / 100;
                document.getElementById('svg-text-top-node').setAttribute('font-size', (7.5 * fScale).toFixed(1));
                document.getElementById('svg-text-uid-node').setAttribute('font-size', (5.0 * fScale).toFixed(1));
                document.getElementById('svg-text-bottom-node').setAttribute('font-size', (6.5 * fScale).toFixed(1));

                document.getElementById('svg-text-top').textContent = this.current.series || '';
                document.getElementById('svg-text-bottom').textContent = this.current.title || '';
                document.getElementById('svg-text-uid').textContent = this.current.audioId ? `ID: ${this.current.audioId}` : '';
            }
        };

        // --- 4. PRINT STUDIO (P0-8 ISOLATION) ---
        const PrintState = {
            format: '43-12',
            slots: new Array(12).fill(null),

            getGeometry() {
                const map = {
                    '43-12': { w: 43, h: 43, cols: 3, rows: 4, ml: 30.5, mt: 47.5, gx: 10, gy: 10 },
                    '40-24': { w: 40, h: 40, cols: 4, rows: 6, ml: 17.5, mt: 16.0, gx: 5, gy: 5 },
                    '40-12': { w: 40, h: 40, cols: 3, rows: 4, ml: 35.0, mt: 53.5, gx: 10, gy: 10 },
                    '30-48': { w: 30, h: 30, cols: 6, rows: 8, ml: 15.0, mt: 28.5, gx: 0, gy: 0 }
                };
                return map[this.format] || map['43-12'];
            },
            changeFormat(val) {
                this.format = val;
                const geo = this.getGeometry();
                const total = geo.cols * geo.rows;
                this.slots = this.slots.slice(0, total);
                while(this.slots.length < total) this.slots.push(null);
                this.render();
            },
            addCurrent() {
                if(!EditorState.current) return alert("Kein Cover im Editor!");
                const emptyIdx = this.slots.findIndex(s => s === null);
                if(emptyIdx === -1) return alert("Druckbogen voll!");
                
                // Deep Copy State to freeze values for this slot
                this.slots[emptyIdx] = {
                    item: { ...EditorState.current },
                    state: { zoom: EditorState.zoom, x: EditorState.x, y: EditorState.y, font: EditorState.font }
                };
                App.switchView('print');
                this.render();
            },
            remove(idx) { this.slots[idx] = null; this.render(); },
            clear() { this.slots.fill(null); this.render(); },
            
            render() {
                const grid = document.getElementById('print-sheet-grid');
                if(!grid) return;
                grid.innerHTML = '';
                
                const geo = this.getGeometry();
                let count = 0;

                this.slots.forEach((data, index) => {
                    const col = index % geo.cols;
                    const row = Math.floor(index / geo.cols);
                    
                    // True MM mapping converted to percentages for responsive A4 preview
                    const lP = ((geo.ml + (col * (geo.w + geo.gx))) / 210) * 100;
                    const tP = ((geo.mt + (row * (geo.h + geo.gy))) / 297) * 100;
                    const wP = (geo.w / 210) * 100;
                    const hP = (geo.h / 297) * 100;

                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.style.left = `${lP}%`; slot.style.top = `${tP}%`;
                    slot.style.width = `${wP}%`; slot.style.height = `${hP}%`;

                    if (data) {
                        count++;
                        const s = document.createElement('div');
                        s.className = 'sticker';
                        
                        const img = document.createElement('img');
                        img.src = data.item.image;
                        img.style.cssText = `position:absolute;width:100%;height:100%;object-fit:contain;transform:translate(${data.state.x}%, ${data.state.y}%) scale(${data.state.zoom/100})`;
                        s.appendChild(img);

                        const svgNS = 'http://www.w3.org/2000/svg';
                        const svg = document.createElementNS(svgNS, 'svg');
                        svg.setAttribute('viewBox', '0 0 100 100');
                        svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
                        
                        const pt = document.createElementNS(svgNS, 'path'); pt.id=`p1-${index}`; pt.setAttribute('d','M 10,50 A 40,40 0 0,1 90,50'); pt.setAttribute('fill','none');
                        const pu = document.createElementNS(svgNS, 'path'); pu.id=`p2-${index}`; pu.setAttribute('d','M 22,50 A 28,28 0 0,0 78,50'); pu.setAttribute('fill','none');
                        const pb = document.createElementNS(svgNS, 'path'); pb.id=`p3-${index}`; pb.setAttribute('d','M 8,50 A 42,42 0 0,0 92,50'); pb.setAttribute('fill','none');
                        svg.append(pt, pu, pb);

                        const mkT = (sz, col, path, txt) => {
                            const n = document.createElementNS(svgNS, 'text');
                            n.setAttribute('font-size', sz); n.setAttribute('fill', col); n.setAttribute('font-weight', 'bold'); n.setAttribute('text-anchor', 'middle');
                            const tp = document.createElementNS(svgNS, 'textPath'); tp.setAttribute('href', `#${path}`); tp.setAttribute('startOffset', '50%');
                            tp.textContent = txt; n.appendChild(tp); return n;
                        };
                        
                        const fs = data.state.font/100;
                        svg.appendChild(mkT((7.5*fs).toFixed(1), '#e11d48', `p1-${index}`, data.item.series));
                        svg.appendChild(mkT((5*fs).toFixed(1), '#64748b', `p2-${index}`, data.item.audioId ? `ID: ${data.item.audioId}` : ''));
                        svg.appendChild(mkT((6.5*fs).toFixed(1), '#0f172a', `p3-${index}`, data.item.title));
                        
                        s.appendChild(svg);

                        const act = document.createElement('div'); act.className = 'sticker-actions';
                        const delBtn = document.createElement('button'); delBtn.className='s-btn del'; delBtn.textContent='✕';
                        delBtn.onclick = () => this.remove(index);
                        act.appendChild(delBtn); s.appendChild(act);

                        slot.appendChild(s);
                    }
                    grid.appendChild(slot);
                });
                document.getElementById('print-count').textContent = count;
            }
        };

        // --- APP INITIALIZATION ---
        const App = {
            async initDB() {
                try {
                    // P0: Fetch with cache bypass logic to avoid stale Github Pages
                    const res = await fetch('https://raw.githubusercontent.com/toniebox-reverse-engineering/tonies-json/release/tonies.json', {cache: 'no-store'});
                    if(!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    
                    const rawArray = Array.isArray(data) ? data : (data.tonies || []);
                    if(!rawArray.length) throw new Error("JSON invalid");
                    
                    State.initIndex(rawArray);
                } catch(e) {
                    console.error("DB Load Error", e);
                    document.getElementById('db-error-banner').style.display='flex';
                }
            },
            switchView(id) {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === id));
                document.querySelectorAll('.workspace').forEach(w => w.classList.remove('active'));
                document.getElementById(`view-${id}`).classList.add('active');
            },
            // Mobile Swipe System
            mPage: 0,
            slideToPage(p) {
                const track = document.getElementById('studio-swipe-container');
                if(!track || window.innerWidth > 850) return;
                this.mPage = Math.max(0, Math.min(2, p));
                track.style.transform = `translateX(-${this.mPage * 100}vw)`;
                document.querySelectorAll('#mobile-dots .dot').forEach((d,i) => d.classList.toggle('active', i===this.mPage));
                document.getElementById('mobile-page-label').textContent = ['1/3 Bibliothek', '2/3 Cover-Editor', '3/3 Regler'][this.mPage];
            },
            nextMobilePage() { this.slideToPage(this.mPage+1); },
            prevMobilePage() { this.slideToPage(this.mPage-1); }
        };

        window.onload = () => {
            PrintState.init();
            App.initDB();

            // Setup Mobile Swipe Listener
            let sx=0, sy=0, drag=false;
            const t = document.getElementById('studio-swipe-container');
            t.addEventListener('touchstart', e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;drag=true;}},{passive:true});
            t.addEventListener('touchend', e=>{
                if(!drag)return; drag=false;
                const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
                if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) App.slideToPage(App.mPage+(dx<0?1:-1));
            },{passive:true});
        };
    </script>
</body>
